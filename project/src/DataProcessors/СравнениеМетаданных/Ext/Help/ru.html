<h1>Обработка "Сравнение метаданных"</h1>
<div>Позволяет сравнить между собой структуру метаданных разных релизов.</div>
<div>При этом можно использовать разные варианты отбора для отображения изменений, в т.ч. показывать только те изменения, для которых есть правила конвертации.</div></body></html>
